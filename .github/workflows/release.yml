name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published release tag to build and upload assets for (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  REPO: ${{ github.repository }}

jobs:
  test:
    # Only stable, published releases. workflow_dispatch is validated below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "::error::No release tag provided."
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Release tag '$TAG' is not a formal SemVer tag like v1.2.3. The tag (not the release display name) is used as the build version."
            exit 1
          fi

      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Verify workflow_dispatch target is a stable published release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          is_draft=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')
          is_pre=$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq '.isPrerelease')
          if [ "$is_draft" = "true" ] || [ "$is_pre" = "true" ]; then
            echo "::error::Release $TAG is a draft or prerelease; refusing to build."
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          name="nodeseek-rss-monitor-${GOOS}-${GOARCH}${ext}"
          commit="$(git rev-parse HEAD)"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.version=${TAG} -X main.commit=${commit} -X main.buildTime=${build_time}" \
            -o "dist/${name}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodeseek-rss-monitor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(nodeseek-rss-monitor-*)
          if [ "${#files[@]}" -ne 6 ]; then
            echo "::error::Expected 6 binaries, found ${#files[@]}"
            exit 1
          fi
          sha256sum "${files[@]}" > checksums.txt
          cat checksums.txt

      - name: Upload assets to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Uploads to the existing release only; this never creates a release.
          gh release upload "$TAG" dist/* --clobber --repo "$REPO"
